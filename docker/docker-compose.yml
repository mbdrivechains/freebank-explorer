services:
  web:
    environment:
      # FreeBank: bridge networking, so listen on every container interface; the host port
      # below is published on 127.0.0.1:8080 only, leaving 80/443 free for the front nginx
      FRONTEND_HTTP_HOST: "0.0.0.0"
      FRONTEND_HTTP_PORT: "8080"
      BACKEND_MAINNET_HTTP_HOST: "api"
      # AGPL "Source" link in the footer and on /about: the public URL of this fork's source
      SOURCE_URL: "${SOURCE_URL:-}"
    # FreeBank: the fork's own images, never mempool/*:latest from Docker Hub (stock branding and
    # defaults that call mempool.space). Build from this repo: run ./docker/init.sh from the repo
    # root first (it stages the Dockerfiles, entrypoint and nginx config, as upstream's release
    # build does), then `docker compose build`. For an fbx/mempool-* image built elsewhere, set
    # FBX_TAG to its tag. Needs Docker Compose v2 with BuildKit (additional_contexts, pull_policy).
    image: fbx/mempool-frontend:${FBX_TAG:-local}
    pull_policy: never
    build:
      context: ../frontend
      args:
        commitHash: "${COMMIT_HASH:-}"
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for db:3306 --timeout=720 -- nginx -g 'daemon off;'"
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
  api:
    environment:
      MEMPOOL_HTTP_HOST: "0.0.0.0" # FreeBank: reachable from the web container; never publish 8999
      MEMPOOL_BACKEND: "none"
      CORE_RPC_HOST: "172.27.0.1"
      CORE_RPC_PORT: "8332"
      CORE_RPC_USERNAME: "mempool"
      CORE_RPC_PASSWORD: "mempool"
      DATABASE_ENABLED: "true"
      DATABASE_HOST: "db"
      DATABASE_DATABASE: "mempool"
      DATABASE_USERNAME: "mempool"
      DATABASE_PASSWORD: "mempool"
      STATISTICS_ENABLED: "true"
    # FreeBank: see the note on the web service
    image: fbx/mempool-backend:${FBX_TAG:-local}
    pull_policy: never
    build:
      context: ../backend
      additional_contexts:
        backend: ../backend
        rustgbt: ../rust
      args:
        commitHash: "${COMMIT_HASH:-}"
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    command: "./wait-for-it.sh db:3306 --timeout=720 --strict -- ./start.sh"
    volumes:
      - ./data:/backend/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8999/api/v1/backend-info | grep -q . || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  db:
    environment:
      MYSQL_DATABASE: "mempool"
      MYSQL_USER: "mempool"
      MYSQL_PASSWORD: "mempool"
      MYSQL_ROOT_PASSWORD: "admin"
      MARIADB_AUTO_UPGRADE: "1"
    image: mariadb:10.5.21
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ./mysql/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "mempool", "-pmempool"]
      interval: 5s
      timeout: 5s
      retries: 10
