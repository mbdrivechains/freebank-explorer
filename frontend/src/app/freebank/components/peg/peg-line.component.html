<span class="peg-line" [class.peg-muted]="line?.tone === 'muted'" [class.peg-warn]="line?.tone === 'warn'"><ng-container *ngFor="let part of line?.parts"><ng-container *ngIf="part.sep">&ngsp;&middot;&ngsp;</ng-container><a *ngIf="part.href; else notExternal" class="peg-part" [href]="part.href" target="_blank" rel="noopener" [attr.title]="part.title || null">{{ part.text }}</a><ng-template #notExternal><a *ngIf="part.route; else plain" class="peg-part" [routerLink]="part.route | relativeUrl" [fragment]="part.fragment || undefined" [attr.title]="part.title || null">{{ part.text }}</a><ng-template #plain><span class="peg-part" [attr.title]="part.title || null">{{ part.text }}</span></ng-template></ng-template></ng-container></span>
