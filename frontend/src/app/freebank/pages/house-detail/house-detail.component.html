<div class="container-xl credit-page">
  <h1>House {{ houseId }}</h1>
  <ng-container *ngIf="state$ | async as state">
    <p *ngIf="state.data">
      <app-house-health-badge [house]="state.data.house" [tipHeight]="state.data.tip_height" [showSummary]="true"></app-house-health-badge>
    </p>
    <app-credit-raw-json [state]="state" errorText="Could not load this house"></app-credit-raw-json>
  </ng-container>
</div>
