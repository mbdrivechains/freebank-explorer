<div class="container-xl credit-page">
  <h1>Pool {{ poolId }}</h1>
  <ng-container *ngIf="state$ | async as state">
    <p *ngIf="state.data && state.data.house">
      Notes of <a [routerLink]="['/house/' | relativeUrl, state.data.house.id]">house {{ state.data.house.id }}</a>&nbsp;<app-house-health-badge [house]="state.data.house" [tipHeight]="state.data.tip_height"></app-house-health-badge>
    </p>
    <app-credit-raw-json [state]="state" errorText="Could not load this pool"></app-credit-raw-json>
  </ng-container>
</div>
