<div class="container p-lg-0 pb-0" style="max-width: 100%; margin-top: 7px" *ngIf="storageService.getValue('hideWarning') !== 'hidden'">
  <div class="alert alert-danger mb-0 text-center">
    <div class="message-container">
      <!-- easynet: the one network here is easynet (served in testnet mode); no Testnet3/Testnet4 notice -->
      <span>easynet is a test network. Its coins have no value, and the chain may be reset.</span>
    </div>
    <button type="button" class="close" (click)="dismissWarning()">
      <span aria-hidden="true">&times;</span>
    </button>
  </div>
</div>
