<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 150" width="100%" height="100%">
  <defs>
    <!-- BIP300 / Bitcoin Orange Gradient -->
    <linearGradient id="btcGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7931A" />
      <stop offset="100%" stop-color="#FF5A00" />
    </linearGradient>
    <!-- Tech Dark Gray Gradient -->
    <linearGradient id="darkGray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2D42" />
      <stop offset="100%" stop-color="#14151F" />
    </linearGradient>
  </defs>

  <g transform="translate(10, 5)">
    <!-- Vertical Stem of the B -->
    <line x1="35" y1="20" x2="35" y2="120" stroke="url(#darkGray)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Top Loop of the B -->
    <path d="M 35 25 C 95 15, 95 70, 45 70" fill="none" stroke="url(#btcGradient)" stroke-width="12" stroke-linecap="round" />
    
    <!-- Bottom Loop of the B -->
    <path d="M 40 70 C 110 70, 110 130, 35 115" fill="none" stroke="url(#btcGradient)" stroke-width="12" stroke-linecap="round" />

    <!-- Nodes / Connection points -->
    <circle cx="35" cy="20" r="10" fill="#F7931A" />
    <circle cx="35" cy="70" r="10" fill="#2B2D42" />
    <circle cx="35" cy="120" r="10" fill="#FF5A00" />
    
    <!-- Drivechain/Sidechain symbolic node -->
    <circle cx="85" cy="100" r="7" fill="#2B2D42" />
    <line x1="68" y1="92" x2="85" y2="100" stroke="#2B2D42" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
