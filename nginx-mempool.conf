	access_log /var/log/nginx/access_mempool.log;
	error_log /var/log/nginx/error_mempool.log;

	root /var/www/mempool/browser;

	index index.html;

	# enable browser and proxy caching
	add_header Cache-Control "public, no-transform";

	# fallback for all URLs i.e. /address/foo /tx/foo /block/000
	# FreeBank: English only - the build has just the en-US/ folder, whatever the browser language
	location / {
		try_files /en-US/$uri /en-US/$uri/ $uri $uri/ @index-redirect;
		expires 10m;
	}
	# FreeBank: a missing resource is a 404, not index.html with 200 (deleted mempool assets,
	# and mining-pools/<slug>.svg, whose onError fallback then fires at once)
	location /resources {
		try_files $uri =404;
		expires 1h;
	}

	# only cache /resources/config.* for 5 minutes since it changes often
	location /resources/config. {
		try_files $uri =404;
		expires 5m;
	}
	# only cache /resources/customize.* for 5 minutes since it changes often
	location /resources/customize. {
		try_files $uri =404;
		expires 5m;
	}

	location @index-redirect {
		rewrite (.*) /en-US/index.html;
	}

	# location block using regex are matched in order

	# FreeBank: old language-prefixed links (/fr/, /de/tx/<id>, /ja) go to the same page
	# without the prefix. The list is explicit: a two-letter pattern would also catch /tx/.
	# The redirect is relative so it stays right behind the front nginx.
	location ~ ^/(ar|bg|bs|ca|cs|da|de|el|en|eo|es|et|eu|fa|fi|fr|gl|he|hi|hr|hu|id|it|ja|ka|ko|lt|lv|mk|ms|nb|ne|nl|nn|pl|pt|pt-BR|ro|ru|sh|sk|sl|sr|sv|th|tr|uk|vi|zh)(/|$) {
		absolute_redirect off;
		rewrite ^/[^/]+/?(.*)$ /$1 permanent;
	}

	# static API docs
	location = /api {
		try_files $uri $uri/ /en-US/index.html =404;
	}
	location = /api/ {
		try_files $uri $uri/ /en-US/index.html =404;
	}

	# FreeBank: pass the client address chain on to the backend (it logs X-Forwarded-For)
	location /api/v1/ws {
		proxy_pass http://127.0.0.1:8999/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
	# FreeBank: mempool.space services (sponsors, accounts, accelerator) are not proxied
	location /api/v1/services {
		return 404;
	}
	# FreeBank: the backend's internal routes (block definition lists, bitcoin-core passthrough)
	# are not public. Case-insensitive because the backend's routing is.
	location ~* ^/api/(v1/)?internal(/|$) {
		return 403;
	}
	location /api/v1 {
		proxy_pass http://127.0.0.1:8999/api/v1;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
	location /api/ {
		proxy_pass http://127.0.0.1:8999/api/v1/;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# mainnet API
	location /ws {
		proxy_pass http://127.0.0.1:8999/;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "Upgrade";
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}

	# FreeBank: there is no preview unfurler; og:image /render/... links get a 404, not index.html
	location ^~ /render/ {
		return 404;
	}
